services:
  yt-dashboard:
    build: .
    image: yt-dashboard:latest
    container_name: yt-dashboard
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./output:/app/output
      - ./assets:/app/assets:ro
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    networks:
      - web

networks:
  web:
    external: true
