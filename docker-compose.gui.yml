services:
  yt-dashboard:
    build: .
    image: yt-dashboard:latest
    container_name: yt-dashboard
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./output:/app/output
      - ./assets:/app/assets:ro
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      # Mount the crontab of the user that owns the cron job so the dashboard
      # can show the real schedule. Run `USER=<cron-user> docker compose ...`
      # so ${USER} resolves to the right account.
      - /var/spool/cron/crontabs/${USER:-root}:/app/host-crontab:ro
    networks:
      - web

networks:
  web:
    external: true
